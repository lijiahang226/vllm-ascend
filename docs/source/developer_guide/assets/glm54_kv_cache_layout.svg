<text x="450" y="584" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" fill="#243447">原生页：MLA 144 KiB / indexer 32 KiB；每个 pool ID 合计 960 KiB</text>
