<text x="24" y="30" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" fill="#243447">GLM-5.4：按缓存职责分组</text>
<text x="24" y="58" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" fill="#243447">分组只依赖历史保留策略；增加层数只扩展组内成员。不同窗口长度分别成组。</text>
